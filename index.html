<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício do Alien</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <script>
      // Cria variaveis contendo o valor da altura e largura do jogo
      const larguraJogo = 700;
      const alturaJogo = 850;

      // Cria uma variavel contendo a altura e largura do jogo do phaser e chama as funções preload, create e update
      const config = {
        type: Phaser.AUTO,
        width: larguraJogo,
        height: alturaJogo,

        physics: {
          default: "arcade",
          arcade: {
            gravity: { y: 300 },
            debug: true,
          },
        },

        scene: {
          preload: preload,
          create: create,
          update: update,
        },
      };

      // Inicia o phaser com a configuração da variavel config
      const game = new Phaser.Game(config);

      // Variaveis do codigo

      var alien;
      var teclado;
      var fogo;

      // plataformas
      var plataforma;
      var plataforma2;

      // placar e pontuação
      var placar;
      var pontuacao = 0;

      // variaveis de pontos
      var moeda;
      var coracao;
      var variacaoCoracoes = [
        [larguraJogo / 1.25, alturaJogo / 5.5],
        [larguraJogo / 2, alturaJogo / 2.3],
        [larguraJogo / 1.06, alturaJogo / 1.28  ],
      ];
      var posCoracao;

      function preload() {
        this.load.image("background", "assets/bg.png");
        this.load.image("player", "assets/alienigena.png");
        this.load.image("turbo_nave", "assets/turbo.png");
        this.load.image("plataforma_tijolo", "assets/tijolos.png");
        this.load.image("plataforma_tijolo2", "assets/tijolos.png");
        this.load.image("moeda", "assets/moeda.png");
        this.load.image("coracao", "assets/coracao.png");
      }

      function create() {
        // Coloca a imagem na tela
        this.add.image(larguraJogo / 2, alturaJogo / 2, "background");

        // Cria o fogo do turbo da nave (chamado primeiro para ficar em baixo da nave)
        fogo = this.add.sprite(0, 0, "turbo_nave");
        fogo.setVisible(false);

        // Cria o alien e adiciona as fisicas a ele
        alien = this.physics.add.sprite(larguraJogo / 2, 0, "player");
        alien.setCollideWorldBounds(true);
        // Cria os inputs do teclado
        teclado = this.input.keyboard.createCursorKeys();

        // Cria a plataforma e adiciona colisão a ela
        plataforma = this.physics.add.staticImage(
          larguraJogo / 2,
          alturaJogo / 2,
          "plataforma_tijolo"
        );
        this.physics.add.collider(alien, plataforma);

        // Cria uma segunda plataforma e adiciona colisão a ela
        plataforma2 = this.physics.add.staticImage(
          larguraJogo / 1.25,
          alturaJogo / 4,
          "plataforma_tijolo2"
        );
        this.physics.add.collider(alien, plataforma2);

        // Cria a moeda e configura ela para o jogo
        moeda = this.physics.add.sprite(larguraJogo / 2, 0, "moeda");
        moeda.setCollideWorldBounds(true);
        moeda.setBounce(0.7);
        this.physics.add.collider(moeda, plataforma);
        this.physics.add.collider(moeda, plataforma2);

        // Cria o coracao e configura ele para o jogo
        posCoracao = Math.floor(Math.random() * variacaoCoracoes.length);
        coracao = this.physics.add.sprite(
          variacaoCoracoes[posCoracao][0],
          variacaoCoracoes[posCoracao][1],
          "coracao"
        );
        coracao.setCollideWorldBounds(true);
        coracao.body.immovable = true;
        coracao.body.allowGravity = false; 

        // Adicionando placar
        placar = this.add.text(50, 50, "Moedas:" + pontuacao, {
          fontSize: "45px",
          fill: "#495613",
        });

        // Logica para quando a moeda for tocada
        this.physics.add.overlap(alien, moeda, function () {
          moeda.setVisible(false);
          var posicaoMoeda_Y = Phaser.Math.RND.between(50, 650);
          moeda.setPosition(posicaoMoeda_Y, 100);
          pontuacao += 1;
          placar.setText("Moedas:" + pontuacao);
          moeda.setVisible(true);
        });

        // Logica para quando o coracao for tocado
        this.physics.add.overlap(alien, coracao, function () {
          coracao.setVisible(false);
          
          // Ajusta a posição do coração dependendo de onde o poscoracao estiver no array
          if(posCoracao >= variacaoCoracoes.length - 1) {
            posCoracao = 0;
          } else {
            posCoracao++;
          }

          // Adiciona 10 moedas se o coração for tocado
          coracao.setPosition(variacaoCoracoes[posCoracao][0], variacaoCoracoes[posCoracao][1]);
          pontuacao += 2;
          placar.setText("Moedas:" + pontuacao);
          coracao.setVisible(true);
        });
      }

      function update() {
        // Move o personagem para direita ou esquerda
        if (teclado.left.isDown) {
          alien.setVelocityX(-200);
        } else if (teclado.right.isDown) {
          alien.setVelocityX(200);
        } else {
          alien.setVelocityX(0);
        }

        // Move o personagem para cima
        if (teclado.up.isDown) {
          alien.setVelocityY(-200);
          ativarTurbo();
        } else {
          semTurbo();
        }

        // Coloca o fogo na posição da nave do alien
        fogo.setPosition(alien.x, alien.y + alien.height / 2);
      }

      // Funções para deixar o fogo visivel ou invisivel
      function ativarTurbo() {
        fogo.setVisible(true);
      }
      function semTurbo() {
        fogo.setVisible(false);
      }
    </script>
  </body>
</html>
